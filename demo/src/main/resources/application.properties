spring.application.name=demo

# ビュー名が "jsp/" で始まるものは JSP（src/main/webapp/WEB-INF/jsp/*.jsp）、
# それ以外は Thymeleaf（src/main/resources/templates/*.html）で表示する。
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp
spring.thymeleaf.excluded-view-names=jsp/*

# レッスン11：PostgreSQL への接続
spring.datasource.url=jdbc:postgresql://localhost:5432/springboot
spring.datasource.username=postgres
spring.datasource.password=postgres
# 起動時に schema.sql（テーブル作成）と data.sql（サンプルデータ）を実行する
spring.sql.init.mode=always
