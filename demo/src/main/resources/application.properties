spring.application.name=demo

# ビュー名が "jsp/" で始まるものは JSP（src/main/webapp/WEB-INF/jsp/*.jsp）、
# それ以外は Thymeleaf（src/main/resources/templates/*.html）で表示する。
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp
spring.thymeleaf.excluded-view-names=jsp/*

# レッスン11：PostgreSQL への接続
spring.datasource.url=jdbc:postgresql://localhost:5432/springboot
spring.datasource.username=postgres
spring.datasource.password=postgres
# 起動時に schema.sql（テーブル作成）と data.sql（サンプルデータ）を実行する
spring.sql.init.mode=always

# レッスン16：Spring Data JPA
# テーブルは schema.sql で作るので、Hibernate には作らせない
spring.jpa.hibernate.ddl-auto=none
# 実行された SQL をコンソールに表示する（学習用）
spring.jpa.show-sql=true
# ビューを表示している間は DB に接続しない（推奨設定）
spring.jpa.open-in-view=false
