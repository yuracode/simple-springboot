<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>月の集計</title>
  <style>
    body { background: #fff8e1; }
    table { border-collapse: collapse; } th, td { border: 1px solid #999; padding: 4px 8px; }
    td.num { text-align: right; }
    .income { color: blue; } .expense { color: red; }
  </style>
</head>
<body>
  <!-- モック：GET /pocket/summary?month=2026-10 -->
  <h1>2026年10月の集計</h1>

  <form action="summary.html" method="get">
    <input type="month" name="month" value="2026-10">
    <button type="submit">表示</button>
  </form>

  <table>
    <tr><th>収入</th><td class="num income">3,500円</td></tr>
    <tr><th>支出</th><td class="num expense">1,250円</td></tr>
    <tr><th>差し引き</th><td class="num">2,250円</td></tr>
  </table>

  <h2>カテゴリ別の支出</h2>
  <table>
    <tr><th>カテゴリ</th><th>件数</th><th>合計</th></tr>
    <tr><td>本</td><td class="num">1</td><td class="num">800円</td></tr>
    <tr><td>文房具</td><td class="num">1</td><td class="num">300円</td></tr>
    <tr><td>おやつ</td><td class="num">1</td><td class="num">150円</td></tr>
  </table>

  <p><a href="summary.html">← 前の月</a> ｜ <a href="summary.html">次の月 →</a></p>
  <a href="index.html">一覧へ戻る</a>
</body>
</html>
