<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><title>記録の編集</title>
  <style>.error { color: red; } input.is-error { border: 2px solid red; }</style>
</head>
<body>
  <!-- モック：GET /pocket/{id}/edit（id=3 を開いた状態） -->
  <h1>記録の編集</h1>
  <form action="index.html" method="get">
    日付：<input type="date" name="entryDate" value="2026-10-05"><br>
    種類：
      <label><input type="radio" name="type" value="収入">収入</label>
      <label><input type="radio" name="type" value="支出" checked>支出</label><br>
    カテゴリ：
      <select name="categoryId">
        <option value="1">おこづかい</option>
        <option value="2">お手伝い</option>
        <option value="3">おやつ</option>
        <option value="4" selected>本</option>
        <option value="5">文房具</option>
        <option value="6">あそび</option>
        <option value="7">その他</option>
      </select><br>
    金額：<input type="text" name="amount" value="800">円<br>
    メモ：<input type="text" name="memo" size="30" value="マンガ"><br>
    <button type="submit">更新する</button>
  </form>
  <form action="index.html" method="get">
    <button type="submit">この記録を削除する</button>
  </form>
  <a href="index.html">一覧へ戻る</a>
</body>
</html>
